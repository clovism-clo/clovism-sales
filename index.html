const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));
  const html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
}
async function tryOpen(pw,remember){
  const btn=document.getElementById('go');btn.disabled=true;btn.textContent='여는 중…';
  try{try{sessionStorage.setItem('clv_pw_s',pw);}catch(e){}await open(pw);try{if(remember)localStorage.setItem('clv_pw',pw);else localStorage.removeItem('clv_pw');}catch(e){}}
  catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않습니다.';btn.disabled=false;btn.textContent='열기';try{localStorage.removeItem('clv_pw');}catch(x){}}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();tryOpen(document.getElementById('pw').value,document.getElementById('remember').checked);});
try{const s=localStorage.getItem('clv_pw');if(s){document.getElementById('pw').value=s;tryOpen(s,true);}else{const t=sessionStorage.getItem('clv_pw_s');if(t){document.getElementById('pw').value=t;tryOpen(t,false);}}}catch(e){}
